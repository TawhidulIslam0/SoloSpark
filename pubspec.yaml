name: solospark_pro
description: A structured Flutter app for freelancers to manage clients, invoices, expenses, and business records.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  pdf: ^3.11.3
  printing: ^5.14.2
  csv: ^6.0.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  cross_file: ^0.3.4+2
  url_launcher: ^6.3.1
  image: 4.10.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
